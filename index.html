<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DoSantos — Futuristic Theme</title>

<!-- ====== FUTURISTIC CSS ====== -->
<style>
    body {
        margin: 0;
        font-family: "Orbitron", sans-serif;
        background: radial-gradient(circle at top, #0c0c0c, #000000);
        color: #e6e6e6;
        overflow-x: hidden;
    }

    header {
        text-align: center;
        padding: 60px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
        font-size: 3rem;
        letter-spacing: 4px;
        color: #00eaff;
        text-shadow: 0 0 12px #00eaff;
        margin-bottom: 10px;
    }

    h2 {
        color: #00c4ff;
        text-shadow: 0 0 8px #00c4ff;
    }

    nav {
        margin-top: 20px;
    }

    nav a {
        margin: 0 15px;
        color: #00eaff;
        text-decoration: none;
        font-weight: bold;
    }

    nav a:hover {
        color: #00ffba;
        text-shadow: 0 0 10px #00ffba;
    }

    .photos {
        padding: 50px 5%;
        text-align: center;
    }

    .photo-grid {
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 25px;
    }

    .photo-grid img {
        width: 100%;
        border-radius: 10px;
        border: 1px solid rgba(0,255,255,0.3);
        box-shadow: 0 0 20px rgba(0,255,255,0.3);
        transform: scale(1);
        transition: 0.3s;
    }

    .photo-grid img:hover {
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(0,255,255,0.7);
    }

    footer {
        margin-top: 50px;
        padding: 20px;
        text-align: center;
        font-size: 0.9rem;
        opacity: 0.6;
    }
</style>
</head>

<body>

<!-- ====== HEADER ====== -->
<header>
    <h1>DoSantos</h1>
    <h2>Futuristic Experience</h2>
    <nav>
        <a href="#photos">Photos</a>
        <a href="#about">About</a>
    </nav>
</header>

<!-- ====== PHOTOS SECTION ====== -->
<section id="photos" class="photos">
    <h2>Photo Gallery</h2>
    <p>Explore futuristic visuals.</p>

    <div class="photo-grid">
        <img src="https://images.unsplash.com/photo-1520072959219-c595dc870360?auto=format&fit=crop&w=900&q=60" alt="Futuristic city">
        <img src="https://images.unsplash.com/photo-1526401485004-2fda9f6d1f1a?auto=format&fit=crop&w=900&q=60" alt="Neon lights">
        <img src="https://images.unsplash.com/photo-1496307042754-b4aa456c4a2d?auto=format&fit=crop&w=900&q=60" alt="Tech scene">
        <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=900&q=60" alt="AI concept">
    </div>
</section>

<!-- ====== ABOUT SECTION ====== -->
<section id="about" class="photos">
    <h2>About DoSantos</h2>
    <p>A futuristic web theme inspired by neon lights, cyber aesthetics, and the digital future.</p>
</section>

<!-- ====== FOOTER ====== -->
<footer>
    © 2025 DoSantos — Futuristic Theme
</footer>

<!-- ====== JAVASCRIPT (Optional Futuristic Effect) ====== -->
<script>
    // Simple futuristic glow pulse effect on header
    const header = document.querySelector("header h1");
    setInterval(() => {
        header.style.textShadow =
            `0 0 ${Math.random()*20}px #00eaff`;
    }, 200);
</script>

</body>
</html>
